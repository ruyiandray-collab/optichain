# 问答合规边界：在调用 LLM 之前用确定性规则拦截（问答接口与测试共用这一份）。
# 命中任一 pattern（正则，不区分大小写）即直接返回对应 reply，不进入检索和 LLM。
version: 1
rules:
  - id: investment_advice
    desc: 买卖 / 目标价 / 仓位 / 涨跌预测类问题
    patterns:
      - "(能|可以|该|要不要|值不值得|值得)(买|卖|入手|上车|抄底|加仓|减仓|清仓|持有)"
      - "(买入|卖出|增持|减持|建仓|加仓|减仓|止损|止盈|抄底|割肉)"
      - "目标价|合理估值是多少|估值到多少|股价.*(多少|几块)|涨到|跌到|会涨|会跌|还能涨|能涨|上涨空间|下跌空间"
      - "仓位|配置比例|推荐.*(股票|个股|标的)|哪只.*(好|值得)|最值得|首选"
      - "\\b(buy|sell|target price|price target|position sizing|worth buying|undervalued|overvalued)\\b"
      # 审查发现：“适合立即入手”能绕过原规则
      - "(适合|建议|值得|应该|应当|推荐|不妨|可考虑|可以考虑|最好)[^，。？?！!]{0,6}(买|入手|上车|抄底|加仓|减仓|建仓|持有|卖出|卖掉|止盈|止损|配置)"
      # 繁体写法（输入会先做繁转简，这里作为兜底）
      - "(買入|賣出|能買|能賣|該買|值得買|加倉|減倉|倉位|目標價|上漲空間|抄底)"
      # 独立审查发现的绕过问法（匹配前已做全角转半角、繁转简、去空格）
      - "值得投资|投资价值|有没有投资|能否投资|可以投资|买(入)?合适|合适(买|入手|介入)|被?低估|被?高估|估值(偏)?(低|高)吗|(投资|买入|增持|减持|卖出|中性|推荐)评级|评级(为|是)?(买入|增持|推荐)|看好|重点关注|会涨|会跌|涨吗|跌吗|满仓|半仓|梭哈|割肉|上车|下车"
      - "\\b(invest|investing|investment|should i|rating|bullish|bearish|undervalued|overvalued)\\b"
      # 交叉核对（astra）发现：涨跌预测类表述漏判
      - "(股价|股票|市值)[^，。？?]{0,8}(翻倍|翻番|暴涨|大涨|腰斩|暴跌|新高)|必然(上涨|下跌|翻倍)|翻倍股|(涨|跌)幅(会|将)|涨停|跌停"
    # 注意：reply 必须紧跟本规则（交叉核对发现：插入新规则时把这一行挤到了 prompt_injection 下，导致本规则没有拒答话术）
    reply: "抱歉，本产品只提供产业链研究信息（环节归属、证据可信度、可比口径、传导路径），不提供买卖、目标价、仓位或涨跌判断，也不构成投资建议。你可以问：某公司属于哪个环节、证据是什么，某个外部变量会影响哪些公司的哪些指标。"
  - id: prompt_injection
    desc: 要求忽略规则 / 扮演其他角色 / 输出系统提示
    patterns:
      - "忽略(以上|上述|之前|前面|所有|全部)?(的)?(规则|指令|要求|设定|限制|提示)"
      - "(不要|无需|别)(遵守|理会)(规则|限制)|扮演|你现在是|system prompt|系统提示词"
      - "\\b(ignore (all |the )?(previous|above|prior)|disregard|jailbreak)\\b"
    reply: "这个请求要求绕过产品规则，无法执行。本产品只基于快照证据回答产业链研究问题，不提供投资建议。"
  - id: full_text
    desc: 要求输出研报 / 公告全文
    patterns:
      - "(全文|完整版|原文全部|整篇|全部内容)"
      - "(下载|发我|给我).*(研报|报告|公告|pdf|PDF)"
    reply: "抱歉，研报和公告不做全文分发。本产品只展示与问题相关的片段，并附来源名称、日期和链接（公告为巨潮检索页），你可以通过链接查看原文。"
  - id: realtime
    desc: 实时行情
    patterns:
      - "(现在|今天|此刻|实时|最新).*(股价|价格|行情|涨幅|跌幅)"
    reply: "本产品的数据不是实时的：行情和估值截至快照的数据截止日，财务截至最新报告期。实时行情请以交易所或行情软件为准。"

# 检索不到相关证据时的统一回复（“不知道就说不知道”）
no_evidence_reply: "快照中没有检索到能回答这个问题的证据，所以无法回答。目前覆盖的是 26 家 A 股光互联相关公司、12 家海外可比公司，以及 225 只 CPO 概念成分股。"
# 回答中的每个数字都必须出现在检索到的上下文里，否则拒绝输出这段回答
number_check: true
