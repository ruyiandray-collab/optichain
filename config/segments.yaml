# 产业链分层口径（自建，见 docs/proposal.md 第 1 节）。
# product_keywords：iFinD 主营构成（按产品）的“项目名称”命中这些词，才算该环节的“有收入”证据（A 级）。
# generic_items：口径太宽的项目名，命中也不能单独判 A，需要文本证据说明其中用于光互联的部分。
# 词表由 AI 起草、人工审核；每次修改都在 ai_log 里记录。
version: 1
layers:
  - id: upstream
    name: 上游
    segments:
      - id: optical_chip
        name: 光芯片
        desc: 激光器芯片（EML / DFB / CW / VCSEL）、探测器芯片（PD / APD）
        product_keywords: [光芯片, 激光器芯片, 探测器芯片, EML, DFB, VCSEL, CW光源, 数据中心类产品, 电信市场类]
        generic_items: [激光器, 芯片]
      - id: electrical_chip
        name: 电芯片
        desc: DSP、Driver、TIA、CDR、光模块电源和模拟芯片
        product_keywords: [DSP, TIA, 驱动芯片, CDR, 光模块专用]
        generic_items: [模拟芯片, 集成电路, 电源管理, 信号链]
      - id: optical_component
        name: 光器件 / 光引擎组件
        desc: 光有源和无源器件、FAU、透镜、隔离器、MPO 连接器
        product_keywords: [光有源器件, 光无源器件, 光器件, 光纤连接器, 光引擎, 无源器件, 有源器件, 光纤器件]
        generic_items: [连接器, 光学元件, 光学元器件]
      - id: substrate
        name: 封装材料与基板
        desc: 陶瓷外壳 / 基板、高速 PCB
        product_keywords: [光通信器件外壳, 光模块陶瓷]
        generic_items: [电子陶瓷材料及元件, 印制电路板, PCB, 企业通讯市场板]
      - id: equipment
        name: 设备
        desc: 耦合、贴片、测试设备
        product_keywords: [光模块测试, 耦合设备]
        generic_items: [自动化设备, 智能装备, 测试设备]
  - id: midstream
    name: 中游
    segments:
      - id: module
        name: 光模块（可插拔 / LPO）
        desc: 400G / 800G / 1.6T 数通光模块，电信光模块
        product_keywords: [光模块, 光通信收发模块, 光互联产品, 收发模块, 光通信模块, 数通]
        generic_items: [光通信, 组件, 通信设备]
      - id: cpo
        name: CPO / NPO 光引擎
        desc: 共封装光学，目前多处于研发或送样阶段
        product_keywords: [CPO, NPO, 共封装]
        generic_items: []
  - id: downstream
    name: 下游
    segments:
      - id: switch_server
        name: 交换机 / AI 服务器 / GPU
        desc: 光模块的直接采购方或系统方
        product_keywords: [交换机, 服务器, 云计算设备, 数据中心]
        generic_items: [网络设备, ICT基础设施]
      - id: cloud
        name: 云厂商（需求方）
        desc: 资本开支是光模块需求的源头
        product_keywords: []
        generic_items: []

concepts:
  - id: cpo
    name: 共封装光学(CPO)
    ifind_concept: 共封装光学(CPO)
    stage_keywords:
      revenue: [收入, 营收, 营业收入, 占比]
      order: [批量出货, 量产, 批量供货, 订单, 大批量, 规模收入, 实现销售, 客户认证, 通过验证, 扩产, 募投]
      rnd: [研发, 送样, 小批量, 开发中, 验证中, 样品, 预研, 储备]
      talk: [关注, 布局, 可应用于, 有望, 积极, 探索, 储备技术]
      deny: [不涉及, 未开展, 尚未, 没有相关, 暂无, 未形成收入, 澄清]
